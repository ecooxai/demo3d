name: Deploy Yuukapa to GitHub Pages

on:
  push:
    branches:
      - minimax-m31-flash/opencode-webgpu-yuukapa
    paths:
      - 'minimaxm31flash/yuukapa_devtool/output/**'
      - '.github/workflows/yuukapa-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the static site
        run: |
          set -euo pipefail
          SITE="$GITHUB_WORKSPACE/site"
          rm -rf "$SITE"
          mkdir -p "$SITE"
          # landing page
          cp minimaxm31flash/yuukapa_devtool/output/site/index.html "$SITE/index.html"
          # the viewer (self-contained showcase bundle)
          cp -R minimaxm31flash/yuukapa_devtool/output/yuukapa_showcase/. "$SITE/"
          # the showcase clip
          cp minimaxm31flash/yuukapa_devtool/output/*.mp4 "$SITE/" 2>/dev/null || true
          cp minimaxm31flash/yuukapa_devtool/output/credit.png "$SITE/" 2>/dev/null || true
          echo "site contents:" && ls -la "$SITE"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
