<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>yuukapa 3D — GLM-5.3-Flash (opencode · web)</title>
<link rel="stylesheet" href="./src/styles.css"/>
<link rel="icon" href="data:,"/>
</head>
<body>
  <div id="stage" class="stage">
    <canvas id="gl" class="glcanvas"></canvas>

    <!-- model-name pill sits ABOVE the 3D model -->
    <div id="namePill" class="namepill">
      <span class="np-main">GLM-5.3-Flash</span>
      <span class="np-sub">opencode · web · built-from-scratch 3D — “yuukapa” pajama girl</span>
    </div>

    <div id="hint" class="hint">drag&nbsp;=&nbsp;orbit&nbsp;·&nbsp;wheel&nbsp;/&nbsp;pinch&nbsp;=&nbsp;zoom&nbsp;·&nbsp;double-tap&nbsp;=&nbsp;reset</div>

    <div id="badge" class="badge">
      <span id="bIter">Iter 0</span><span class="bSep">·</span><span id="bScore">Score 0/100</span>
    </div>

    <button id="gear" class="gear" title="Settings" aria-label="Settings">⚙</button>

    <div id="panel" class="panel" hidden>
      <div class="p-row"><div class="p-title">Backend</div>
        <label class="radio"><input type="radio" name="backend" value="webgpu"><span>WebGPU</span></label>
        <label class="radio"><input type="radio" name="backend" value="webgl2"><span>WebGL2</span></label>
        <div id="gpuNote" class="p-note">—</div>
      </div>
      <div class="p-row"><div class="p-title">Resolution</div>
        <select id="resPreset">
          <option value="900" selected>900 × 1200 (default)</option>
          <option value="1280">1280 × 1704</option>
          <option value="1080">1080 × 1920 (FHD)</option>
          <option value="2k">2K · 1440 × 2560</option>
          <option value="4k">4K · 2160 × 3840</option>
        </select>
        <label class="radio"><input type="radio" name="orient" value="portrait" checked><span>Vertical</span></label>
        <label class="radio"><input type="radio" name="orient" value="landscape"><span>Landscape</span></label>
      </div>
      <div class="p-row"><div class="p-title">View</div>
        <label class="check"><input type="checkbox" id="ckRotate"><span>Auto-rotate</span></label>
        <label class="check"><input type="checkbox" id="ckOutline" checked><span>Outlines</span></label>
        <label class="check"><input type="checkbox" id="ckIdle" checked><span>Idle motion</span></label>
        <button id="btnReset" class="pbtn">Reset view</button>
      </div>
      <div class="p-foot"><span id="fps">-- fps</span><span id="resLabel"></span></div>
    </div>

    <div id="modal" class="modal" hidden>
      <div class="m-card">
        <div class="m-title" id="mTitle"></div>
        <div class="m-body" id="mBody"></div>
        <div class="m-actions" id="mActions"></div>
      </div>
    </div>
  </div>
  <script type="importmap">
  {"imports":{
    "three":"./vendor/three/three.webgpu.js",
    "three/addons/":"./vendor/three/addons/"
  }}
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
